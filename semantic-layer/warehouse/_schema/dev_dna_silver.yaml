      - name: txn_date
        type: time
        descriptions:
          db: Date the sale occurred.
      - name: store_code
        type: string
        descriptions:
          db: Code identifying the retail store where the sale occurred.
      - name: city
        type: string
        descriptions:
          db: City the store is located in.
      - name: item_name
