tables:
  cafe_sales:
    table: sahil-devx.dev_dna_silver.cafe_sales
    columns:
      - name: hash_key
        type: string
        descriptions:
          db: Deterministic hash of this record's natural/business key, generated during ingestion. Used internally for deduplication and change-detection; not a business attribute and should not be used for reporting.
      - name: bill_no
        type: string
        descriptions:
          db: POS bill/receipt number issued at the cafe till. Not globally unique across stores on its own; combine with store_location for a unique transaction reference.
      - name: txn_datetime
        type: time
        descriptions:
          db: Timestamp the sale was rung up at the till.
      - name: store_location
        type: string
        descriptions:
          db: Name or code of the cafe outlet where the sale occurred.
      - name: item_name
        type: string
        descriptions:
          db: Menu item name as sold at the till (raw text from the POS system).
      - name: qty
        type: number
        descriptions:
          db: Quantity of this item sold on this bill line.
      - name: rate
        type: number
        descriptions:
          db: Unit price charged for this item, in INR.
      - name: amount
        type: number
        descriptions:
          db: Line amount for this item (qty * rate), in INR, before any bill-level discount.
      - name: payment_mode
        type: string
        descriptions:
          db: How the customer paid (e.g. cash, card, UPI, wallet).
      - name: channel_code
        type: string
        descriptions:
          db: Short code identifying the sales channel this record belongs to (e.g. D2C, OFFLINE, QCOMM, PLATFORM, INTL, CAFE). Joins to dim_channels for the channel's full name, group and settlement currency.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
      - name: order_date_key
        type: time
        descriptions:
          db: Calendar date (YYYY-MM-DD) the order/transaction occurred, derived from the transaction timestamp. Use this column (not the raw timestamp) to join to dim_date for month/quarter/year reporting.
      - name: product_id
        type: string
        descriptions:
          db: Canonical product/SKU identifier the till's item_name was mapped to during ingestion. Joins to item_master.
    descriptions:
      db: "Line-grain point-of-sale transactions from the company's own cafe outlets. One row per line item sold in a single bill. Channel: CAFE."
  customer:
    table: sahil-devx.dev_dna_silver.customer
    columns:
      - name: hash_key
        type: string
        descriptions:
          db: Deterministic hash of this record's natural/business key, generated during ingestion. Used internally for deduplication and change-detection; not a business attribute and should not be used for reporting.
      - name: invoice_no
        type: string
        descriptions:
          db: Invoice number from the legacy retail system. A single invoice can span multiple rows (one per product line); a prefix of 'C' denotes a cancelled invoice.
      - name: stock_code
        type: string
        descriptions:
          db: Legacy system's internal product code for the line item.
      - name: description
        type: string
        descriptions:
          db: Product description text as recorded in the legacy system at time of sale.
      - name: quantity
        type: number
        descriptions:
          db: Units of this product on this invoice line. Negative values indicate a cancellation/credit line.
      - name: invoice_date
        type: time
        descriptions:
          db: Timestamp the invoice line was recorded.
      - name: unit_price
        type: number
        descriptions:
          db: Unit price charged for this line, in the legacy system's transaction currency.
      - name: customer_id
        type: string
        descriptions:
          db: Legacy system's customer identifier for this invoice. May be blank for guest/unidentified checkouts.
      - name: country
        type: string
        descriptions:
          db: Country the order was shipped to, as recorded by the legacy system.
      - name: is_cancelled
        type: boolean
        descriptions:
          db: TRUE when this invoice line is a cancellation/credit (mirrors the 'C'-prefixed invoice_no).
      - name: line_amount
        type: number
        descriptions:
          db: Line amount for this invoice line (quantity * unit_price).
      - name: channel_code
        type: string
        descriptions:
          db: Short code identifying the sales channel this record belongs to (e.g. D2C, OFFLINE, QCOMM, PLATFORM, INTL, CAFE). Joins to dim_channels for the channel's full name, group and settlement currency.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
    descriptions:
      db: "Legacy line-grain invoice data from the company's original online retail system (UK-style invoice export: one row per product line per invoice). Represents the earliest e-commerce channel prior to the current D2C storefront, retained for historical continuity."
  customers_master:
    table: sahil-devx.dev_dna_silver.customers_master
    columns:
      - name: hash_key
        type: string
        descriptions:
          db: Deterministic hash of this record's natural/business key, generated during ingestion. Used internally for deduplication and change-detection; not a business attribute and should not be used for reporting.
      - name: customer_master_id
        type: string
        descriptions:
          db: Unique, conformed customer identifier used across every channel and fact table. Joins to dim_customers_master in the gold layer.
      - name: customer_name
        type: string
        descriptions:
          db: Customer's full name as recorded on their most recent order.
      - name: email
        type: string
        descriptions:
          db: Customer's email address, used as a primary matching key during identity resolution across channels.
      - name: phone
        type: string
        descriptions:
          db: Customer's phone number, used as a secondary matching key during identity resolution.
      - name: city
        type: string
        descriptions:
          db: Customer's city, from their most recent known address.
      - name: state
        type: string
        descriptions:
          db: Customer's state/region, from their most recent known address.
      - name: country
        type: string
        descriptions:
          db: Customer's country, from their most recent known address.
      - name: signup_date
        type: time
        descriptions:
          db: Date the customer's account/profile was first created in any channel.
      - name: acquisition_channel
        type: string
        descriptions:
          db: The sales channel through which this customer was first acquired (their very first order's channel), not necessarily where they buy today.
      - name: loyalty_tier
        type: string
        descriptions:
          db: Customer's current loyalty/membership tier (e.g. Bronze, Silver, Gold), assigned by the loyalty program.
      - name: rn
        type: number
        descriptions:
          db: Row number assigned per natural key by the ingestion pipeline (partitioned by business key, ordered by recency). rn = 1 identifies the current/latest version of a record when historized duplicates exist in this table.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
    descriptions:
      db: Golden-record customer master, deduplicated and conformed across all sales channels. One row per unique customer.
  d2c_orders:
    table: sahil-devx.dev_dna_silver.d2c_orders
    columns:
      - name: hash_key
        type: string
        descriptions:
          db: Deterministic hash of this record's natural/business key, generated during ingestion. Used internally for deduplication and change-detection; not a business attribute and should not be used for reporting.
      - name: order_name
        type: string
        descriptions:
          db: "Shopify order number/name (e.g. #1001), unique per order but repeated across this order's line items."
      - name: created_at
        type: time
        descriptions:
          db: Timestamp the order was placed on the storefront.
      - name: customer_email
        type: string
        descriptions:
          db: Email address the customer used to place this order; used to match this order to customers_master.
      - name: customer_name
        type: string
        descriptions:
          db: Customer's name as entered at checkout.
      - name: billing_city
        type: string
        descriptions:
          db: City on the order's billing address.
      - name: line_item_title
        type: string
        descriptions:
          db: Product title as displayed on the storefront for this order line.
      - name: line_item_qty
        type: number
        descriptions:
          db: Quantity of this product ordered on this line.
      - name: line_item_price
        type: number
        descriptions:
          db: Unit price of this product at time of order, in INR, before discounts.
      - name: discount_code
        type: string
        descriptions:
          db: Discount/coupon code applied at checkout, if any.
      - name: shipping_amount
        type: number
        descriptions:
          db: Shipping fee charged on this order, in INR (typically repeated per line if the order has multiple lines).
      - name: line_total
        type: number
        descriptions:
          db: Final line amount after discounts and any shipping allocation, in INR.
      - name: channel_code
        type: string
        descriptions:
          db: Short code identifying the sales channel this record belongs to (e.g. D2C, OFFLINE, QCOMM, PLATFORM, INTL, CAFE). Joins to dim_channels for the channel's full name, group and settlement currency.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
      - name: order_date_key
        type: time
        descriptions:
          db: Calendar date (YYYY-MM-DD) the order/transaction occurred, derived from the transaction timestamp. Use this column (not the raw timestamp) to join to dim_date for month/quarter/year reporting.
      - name: product_id
        type: string
        descriptions:
          db: Canonical product/SKU identifier. Joins to item_master for product name, category and brand.
    descriptions:
      db: "Line-grain orders placed on the company's own D2C storefront (Shopify). One row per line item per order. Channel: D2C."
  dim_customer:
    table: sahil-devx.dev_dna_silver.dim_customer
    columns:
      - name: hash_key
