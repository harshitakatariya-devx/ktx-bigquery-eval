      - name: employee_id
        type: string
        descriptions:
          db: Unique employee identifier.
      - name: employee_name
        type: string
        descriptions:
          db: Employee's full name.
      - name: role
        type: string
        descriptions:
          db: Employee's job role/title (e.g. Store Manager, Cashier, Barista).
      - name: channel_code
        type: string
        descriptions:
          db: Sales channel this employee is staffed under (e.g. OFFLINE, CAFE).
      - name: store_id
        type: string
        descriptions:
          db: Store or outlet code the employee is assigned to.
      - name: hire_date
        type: time
        descriptions:
          db: Date the employee joined the company.
      - name: employment_status
        type: string
        descriptions:
          db: Employee's current status (e.g. Active, On Leave, Terminated).
      - name: rn
