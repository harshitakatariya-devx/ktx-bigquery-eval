  qcomm_orders:
    table: sahil-devx.dev_dna_silver.qcomm_orders
    columns:
      - name: hash_key
        type: string
        descriptions:
          db: Deterministic hash of this record's natural/business key, generated during ingestion. Used internally for deduplication and change-detection; not a business attribute and should not be used for reporting.
      - name: platform_name
        type: string
        descriptions:
          db: Name of the quick-commerce platform this order came through (e.g. Blinkit, Zepto, Instamart).
      - name: platform_order_id
        type: string
        descriptions:
          db: Platform's own order identifier.
      - name: order_ts
        type: time
        descriptions:
          db: Timestamp the order was placed on the platform.
      - name: dark_store
        type: string
        descriptions:
          db: Dark store/fulfillment micro-warehouse code that fulfilled this order.
      - name: item_name
        type: string
        descriptions:
          db: Product name as listed on the platform for this order line.
      - name: item_code
        type: string
        descriptions:
          db: Platform's own item code for this line, prior to mapping onto the canonical product_id.
      - name: qty
        type: number
        descriptions:
          db: Quantity of this item ordered on this line.
      - name: mrp
        type: number
        descriptions:
          db: Maximum Retail Price (list price) of this item at time of order.
      - name: selling_price
        type: number
        descriptions:
          db: Actual price charged for this item on the platform, in INR, after platform-level pricing.
      - name: total_discount
        type: number
        descriptions:
          db: Total discount amount applied to this line, in INR.
      - name: delivery_fee
        type: number
        descriptions:
          db: Delivery fee charged to the customer for this order, in INR.
      - name: cust_mobile
        type: string
        descriptions:
          db: Customer's mobile number as captured by the platform at checkout.
      - name: order_status
        type: string
        descriptions:
          db: Current status of this order (e.g. Placed, Delivered, Cancelled).
      - name: channel_code
        type: string
        descriptions:
          db: Short code identifying the sales channel this record belongs to (e.g. D2C, OFFLINE, QCOMM, PLATFORM, INTL, CAFE). Joins to dim_channels for the channel's full name, group and settlement currency.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
      - name: order_date_key
        type: time
        descriptions:
          db: Calendar date (YYYY-MM-DD) the order/transaction occurred, derived from the transaction timestamp. Use this column (not the raw timestamp) to join to dim_date for month/quarter/year reporting.
      - name: product_id
        type: string
        descriptions:
          db: Canonical product/SKU identifier. Joins to item_master for product name, category and brand.
    descriptions:
      db: "Line-grain orders fulfilled through quick-commerce delivery platforms (dark stores, rapid delivery). One row per line item per order. Channel: QCOMM."
