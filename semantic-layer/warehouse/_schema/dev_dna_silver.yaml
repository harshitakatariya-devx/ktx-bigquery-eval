        type: string
        descriptions:
          db: Sales channel the ORIGINAL order (being returned) was placed on. Present for every return regardless of channel — do not assume returns exist only for D2C.
      - name: original_order_ref
        type: string
        descriptions:
          db: Reference to the original order/invoice being returned (matches the originating channel table's own order/invoice reference, e.g. order_name, invoice_no, order_id).
      - name: exchange_order_ref
        type: string
        descriptions:
          db: Reference to the new order created if this return was an exchange rather than a refund; NULL for a pure refund.
      - name: return_type
        type: string
        descriptions:
          db: Type of return (e.g. Refund, Exchange, Store Credit).
      - name: reason_code
        type: string
        descriptions:
          db: Reason the customer gave for the return (e.g. Damaged, Wrong Size, Changed Mind).
      - name: initiated_at
        type: time
        descriptions:
          db: Timestamp the customer initiated the return.
      - name: warehouse_received_at
        type: time
        descriptions:
          db: Timestamp the returned item was physically received back at the warehouse/store.
      - name: refund_amount
        type: number
        descriptions:
          db: Amount refunded to the customer for this return, in INR.
      - name: restock_status
        type: string
        descriptions:
          db: Whether the returned item was restockable (e.g. Restocked, Written Off, Pending Inspection).
      - name: rn
        type: number
        descriptions:
          db: Row number assigned per natural key by the ingestion pipeline (partitioned by business key, ordered by recency). rn = 1 identifies the current/latest version of a record when historized duplicates exist in this table.
      - name: insert_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was first loaded into the silver layer. Reflects pipeline load time, not a business event time.
      - name: modified_timestamp
        type: time
        descriptions:
          db: UTC timestamp when this record was last updated by the ingestion pipeline. Reflects pipeline processing time, not a business event time.
      - name: source_name
        type: string
        descriptions:
          db: Name of the upstream source system or source file this record was ingested from. Used for data lineage and troubleshooting, not for business analysis.
      - name: is_deleted
        type: boolean
        descriptions:
          db: Soft-delete flag set by the ingestion pipeline when the source record was removed or tombstoned upstream. Rows where this is TRUE should normally be excluded from business reporting.
      - name: return_date_key
        type: time
        descriptions:
          db: Calendar date (YYYY-MM-DD) the return was initiated, derived from initiated_at. Use this column to join to dim_date for month/quarter/year reporting on returns.
    descriptions:
      db: Product returns and exchanges across all sales channels. One row per return. Every return carries its own channel_code directly (returns are not D2C-only) — use this column, not the original order's channel, when reporting returns by channel.
