        type: string
        descriptions:
          db: Unique reference number for this international order.
      - name: order_date
        type: time
        descriptions:
          db: Timestamp/date the order was placed.
      - name: dest_country
        type: string
        descriptions:
          db: Destination country the order was shipped to.
      - name: customer_name
        type: string
        descriptions:
          db: Customer's name as provided at checkout.
      - name: product_desc
        type: string
        descriptions:
          db: Product description text as recorded by the international order source.
      - name: product_ref_code
        type: string
        descriptions:
          db: Source system's own product reference code for this line item, prior to mapping onto the canonical product_id.
      - name: qty
        type: number
        descriptions:
