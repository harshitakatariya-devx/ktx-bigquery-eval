setup:
  database_connection_ids:
    - warehouse
connections:
  warehouse:
    driver: bigquery
    enabled_tables:
      - sahil-devx.dev_dna_silver.cafe_sales
      - sahil-devx.dev_dna_silver.customer
      - sahil-devx.dev_dna_silver.customers_master
      - sahil-devx.dev_dna_silver.d2c_orders
      - sahil-devx.dev_dna_silver.dim_customer
      - sahil-devx.dev_dna_silver.dim_d2c_order
      - sahil-devx.dev_dna_silver.dim_date
      - sahil-devx.dev_dna_silver.employees
      - sahil-devx.dev_dna_silver.international_orders
      - sahil-devx.dev_dna_silver.inventory_snapshot_expanded
      - sahil-devx.dev_dna_silver.item_master
      - sahil-devx.dev_dna_silver.marketing_spend
      - sahil-devx.dev_dna_silver.mrp_master
      - sahil-devx.dev_dna_silver.offline_orders
      - sahil-devx.dev_dna_silver.platform_orders
      - sahil-devx.dev_dna_silver.product_bundle
      - sahil-devx.dev_dna_silver.product_codes
      - sahil-devx.dev_dna_silver.promotions
      - sahil-devx.dev_dna_silver.purchase_orders
      - sahil-devx.dev_dna_silver.qcomm_orders
      - sahil-devx.dev_dna_silver.returns
      - sahil-devx.dev_dna_silver.shipments
      - sahil-devx.dev_dna_silver.suppliers
    credentials_json: file:~/.config/gcloud/ktx-reader.json
    location: asia-south1
    context:
      queryHistory:
        enabled: false
    dataset_ids:
      - dev_dna_silver
storage:
  state: sqlite
  search: sqlite-fts5
  git:
    author: ktx <ktx@example.com>
llm:
  provider:
    backend: claude-code
  models:
    default: sonnet
    triage: haiku
    candidateExtraction: sonnet
    curator: opus
    reconcile: opus
    repair: haiku
ingest:
  embeddings:
    backend: sentence-transformers
    model: all-MiniLM-L6-v2
    dimensions: 384
  workUnits:
    stepBudget: 40
    maxConcurrency: 1
    failureMode: continue
agent:
  run_research:
    enabled: false
    max_iterations: 20
    default_toolset:
      - sl_query
      - wiki_search
      - sl_read_source
scan:
  enrichment:
    mode: llm
    embeddings:
      backend: sentence-transformers
      model: all-MiniLM-L6-v2
      dimensions: 384
  relationships:
    enabled: true
    llmProposals: true
    validationRequiredForManifest: true
    acceptThreshold: 0.85
    reviewThreshold: 0.55
    maxLlmTablesPerBatch: 40
    maxCandidatesPerColumn: 25
    profileSampleRows: 10000
    profileConcurrency: 4
    validationConcurrency: 4
    detectionBudgetMs: 600000
